name: Upload IPA to App Store Connect

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Directe downloadlink naar de SpotCast IPA"
        required: true
        type: string

jobs:
  upload:
    runs-on: macos-latest

    steps:
      - name: Download IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          curl --fail --location "$IPA_URL" --output SpotCast.ipa
          test -s SpotCast.ipa

      - name: Upload to App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          xcrun altool --upload-app -f SpotCast.ipa -t ios -u "$APPLE_ID" -p "$APP_PASSWORD"

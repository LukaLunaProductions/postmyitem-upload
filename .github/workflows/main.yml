name: Upload IPA to App Store Connect

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Temporary direct-download URL for the IPA"
        required: true
        type: string
      ipa_name:
        description: "App label used for the local IPA filename"
        required: false
        default: "App"
        type: string

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Download IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
          IPA_NAME: ${{ inputs.ipa_name }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$IPA_URL" --output "$IPA_NAME.ipa"
          test -s "$IPA_NAME.ipa"
          unzip -t "$IPA_NAME.ipa" >/dev/null
          echo "IPA archive is valid: $(du -h "$IPA_NAME.ipa" | cut -f1)"

      - name: Upload to App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          IPA_NAME: ${{ inputs.ipa_name }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app -f "$IPA_NAME.ipa" -t ios -u "$APPLE_ID" -p "$APP_PASSWORD"

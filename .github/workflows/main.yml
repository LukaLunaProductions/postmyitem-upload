name: Upload TAALSTAD IPA to App Store Connect

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Download TAALSTAD IPA
        env:
          IPA_URL: "https://uceae3d825b509e78a48f7109c50.dl.dropboxusercontent.com/cd/0/get/DGzxw36vhLg78ejEdFo-OhUb-eQMQHocw8nTQ2uq44KtpztOFJp7_Dss_3jcOI8MuJKV7e19tzVP_cLtXkuV0jppQnkLKb7b93F9ih7Ks71YF9E1T2qc14YC3CETTOFiDSwRsiQ4KYQwp_ME9doM0DIfcdP0GNm5GP31zmt1ffKGOg/file?c_luid=878c00f9"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$IPA_URL" --output "Taalstad.ipa"
          test -s "Taalstad.ipa"
          unzip -t "Taalstad.ipa" >/dev/null
          echo "IPA archive is valid: $(du -h "Taalstad.ipa" | cut -f1)"

      - name: Inspect build metadata
        run: |
          set -euo pipefail
          unzip -q "Taalstad.ipa" -d extracted
          APP_PATH=$(find extracted/Payload -maxdepth 1 -name '*.app' -type d | head -1)
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist" || true

      - name: Upload to App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app --type ios --file "Taalstad.ipa" --username "$APPLE_ID" --password "$APP_PASSWORD"

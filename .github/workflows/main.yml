name: Upload IPA to App Store Connect

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest

    steps:
      - name: Download IPA
        run: |
          curl -L "https://www.dropbox.com/scl/fi/s1v1t76wvrokfuq6jn0hi/ios-2.121943.3.ipa?rlkey=okwun083t7s0tl4cgr6l49ovw&dl=1" -o app.ipa

      - name: Upload to App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          xcrun altool --upload-app -f app.ipa -t ios -u "$APPLE_ID" -p "$APP_PASSWORD"

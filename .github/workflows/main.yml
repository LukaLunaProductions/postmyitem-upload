name: Upload SpotCast IPA to App Store Connect

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - upload-trigger.txt

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Download SpotCast IPA
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "https://uc8c2f6276db1181418f24b42192.dl.dropboxusercontent.com/cd/0/get/DGt6LpPySugESmcCRS-0qwHVbsLVEBD4caKwLIjJ9-d0zMejs8Y77-QovJvxUo6MACNmZIuZZ-S9QpF6_w3n4Jm9mkBx-BadoTIATBKwMxzTGOtwWSfQtffzJzDoGQJavnZeNBBkeNhALqGUcihsg0DZUnaDs0GGCUtmjfZI_Ub_bQ/file?c_luid=878c00f9" --output SpotCast.ipa
          test -s SpotCast.ipa
          file SpotCast.ipa
          echo "IPA size: $(du -h SpotCast.ipa | cut -f1)"

      - name: Validate IPA archive
        run: |
          set -euo pipefail
          unzip -t SpotCast.ipa >/dev/null
          echo "IPA archive is valid."

      - name: Upload to App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app -f SpotCast.ipa -t ios -u "$APPLE_ID" -p "$APP_PASSWORD"

name: Upload IPA to App Store Connect

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest

    steps:
      - name: Download IPA
        run: |
          curl -L "https://www.dropbox.com/scl/fi/0jgy9oeuki6sl8pwpda9c/ios-2.121943.5.ipa?rlkey=p098l8gelq6s9xnzw6q5eof2j&dl=1" -o app.ipa

      - name: Upload to App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          xcrun altool --upload-app -f app.ipa -t ios -u "$APPLE_ID" -p "$APP_PASSWORD"

name: Upload PhotoShape IPA to App Store Connect

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Directe downloadlink naar de PhotoShape IPA"
        required: false
        default: "https://www.dropbox.com/scl/fi/x6h5m8amc4yhb5nja2f84/ios-2.131675.1-3.ipa?rlkey=ds03nb0s6zgwvnr3ucy4xrpx1&st=jtedj6vg&dl=1"
        type: string
  push:
    branches:
      - main
    paths:
      - upload-trigger.txt

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Download PhotoShape IPA
        env:
          DISPATCH_URL: ${{ inputs.ipa_url }}
          DEFAULT_IPA_URL: "https://www.dropbox.com/scl/fi/x6h5m8amc4yhb5nja2f84/ios-2.131675.1-3.ipa?rlkey=ds03nb0s6zgwvnr3ucy4xrpx1&st=jtedj6vg&dl=1"
        run: |
          set -euo pipefail
          IPA_URL="${DISPATCH_URL:-$DEFAULT_IPA_URL}"
          curl --fail --location --retry 3 --retry-delay 2 "$IPA_URL" --output PhotoShape.ipa
          test -s PhotoShape.ipa
          file PhotoShape.ipa
          echo "IPA size: $(du -h PhotoShape.ipa | cut -f1)"

      - name: Validate IPA archive
        run: |
          set -euo pipefail
          unzip -t PhotoShape.ipa >/dev/null
          echo "IPA archive is valid."

      - name: Upload to App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app -f PhotoShape.ipa -t ios -u "$APPLE_ID" -p "$APP_PASSWORD"

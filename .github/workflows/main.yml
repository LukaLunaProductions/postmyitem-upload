name: Upload IPA to App Store Connect

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Temporary direct-download URL for the IPA"
        required: true
        type: string
      ipa_name:
        description: "App label used for the local IPA filename"
        required: false
        default: "App"
        type: string
  push:
    branches: [main]
    paths: [upload-trigger.txt]

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Download IPA
        env:
          IPA_URL: "https://uc17a54b461582ea1f3ef9532864.dl.dropboxusercontent.com/cd/0/get/DGsjtP3jIfzjFRj0Iv1tYVUV8v4Q4n88sUWOWsJMNGkVRiE00BIVCum-M6jyEj7Dd_il0nm2TT7EIJAly-FtSIwyOa4zIru3LjUVIL1mJbxiwLP7-YmCJdKDEef0vJ-ppmDtOmkufn5x9mPoIlUrLxFxvqyZNnzG7KoWzrztFggD5A/file?c_luid=878c00f9"
          IPA_NAME: "SpotCast-build-3"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$IPA_URL" --output "$IPA_NAME.ipa"
          test -s "$IPA_NAME.ipa"
          unzip -t "$IPA_NAME.ipa" >/dev/null
          echo "IPA archive is valid: $(du -h "$IPA_NAME.ipa" | cut -f1)"

      - name: Upload to App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          IPA_NAME: "SpotCast-build-3"
        run: |
          set -euo pipefail
          xcrun altool --upload-app -f "$IPA_NAME.ipa" -t ios -u "$APPLE_ID" -p "$APP_PASSWORD"

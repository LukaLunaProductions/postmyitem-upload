name: Upload IPA to App Store Connect

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest

    steps:
      - name: Download IPA
        run: |
          curl -L "https://www.dropbox.com/scl/fi/wioxw56hqtjlfm33m0mgp/ios-2.121943.1.ipa?rlkey=qzlk28f7j4lnofxsaac406en7&dl=1" -o app.ipa

      - name: Upload to App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          xcrun altool --upload-app -f app.ipa -t ios -u "$APPLE_ID" -p "$APP_PASSWORD"

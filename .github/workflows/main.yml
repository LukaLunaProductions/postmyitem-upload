name: Upload Bingo Bonanza IPA to App Store Connect

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Download Bingo Bonanza IPA
        env:
          IPA_URL: "https://www.dropbox.com/scl/fi/nyqhculjjrmr56fxa27by/bingobonanza.ipa?rlkey=2ktalzqbzcrj20l11bid7v08j&dl=1"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$IPA_URL" --output "BingoBonanza.ipa"
          test -s "BingoBonanza.ipa"
          unzip -t "BingoBonanza.ipa" >/dev/null
          echo "IPA archive is valid: $(du -h "BingoBonanza.ipa" | cut -f1)"

      - name: Inspect build metadata
        run: |
          set -euo pipefail
          unzip -q "BingoBonanza.ipa" -d extracted
          APP_PATH=$(find extracted/Payload -maxdepth 1 -name '*.app' -type d | head -1)
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist" || true

      - name: Upload to App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app -f "BingoBonanza.ipa" -t ios -u "$APPLE_ID" -p "$APP_PASSWORD"

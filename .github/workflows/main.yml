name: Upload IPA to App Store Connect

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest

    steps:
      - name: Download IPA
        run: |
          curl -L "https://www.dropbox.com/scl/fi/2v9d2qixd7tzi9vz41rin/ios-2.121943.4.ipa?rlkey=8bezogq2re6kxjnrc4bxk2p3a&dl=1" -o app.ipa

      - name: Upload to App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          xcrun altool --upload-app -f app.ipa -t ios -u "$APPLE_ID" -p "$APP_PASSWORD"
